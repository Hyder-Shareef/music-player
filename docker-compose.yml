version: '3.8'

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_PORT=8000
      - HOST=0.0.0.0
      - DATABASE_TYPE=sqlite
      - DATABASE_PATH=/app/data/chong.db
      - CORS_ORIGIN=http://localhost:5173,http://localhost:3000,http://localhost:80
    volumes:
      - api_data:/app/data
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_data:
