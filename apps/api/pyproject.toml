[project]
name = "chong-api"
version = "1.0.0"
description = "FastAPI Backend for Chong Web Music Player powered by ytmusicapi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "ytmusicapi>=1.12.0",
    "yt-dlp>=2024.3.10",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "motor>=3.3.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
